<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой день</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мой день">
<meta name="theme-color" content="#f7f2ea">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a cozy personal notebook with a bit of character; warm, quiet, one small reward
   IDEA: the sky over your day: the header's colour and a sun or moon move with the clock
   PICTURE: the sky band with the day ring, filling with points as things get done
   COLOUR and TYPE: warm paper, ink-dark main buttons, pastel project tints; Unbounded for headings and numbers, Golos Text for reading
   LAYOUT: one column up to 680px, sky header full width, tab bar fixed at the bottom like a phone app */
:root{color-scheme:light dark;--bg:light-dark(#f7f2ea,#1b1815);--card:light-dark(#fffdf9,#27221e);--ink:light-dark(#26211d,#f1ebe3);--mute:light-dark(#8a8078,#a89e94);--line:light-dark(#e8dfd2,#3a332d);--plum:light-dark(#6b5aa6,#b9a9f0);--plumsoft:light-dark(#e6e0f5,#3a3350);--acc:#f0a35e;--sh:light-dark(rgba(80,60,40,.08),rgba(0,0,0,.35));--shadow:0 1px 2px var(--sh),0 3px 12px var(--sh);--hd:Unbounded,'Golos Text',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Golos Text',system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
.wrap{max-width:680px;margin:0 auto;padding:0 max(4vw,16px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--line);padding:6px max(2vw,8px) calc(8px + env(safe-area-inset-bottom))}
nav.tabs div{display:flex;width:100%;max-width:680px}
nav.tabs a{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 2px;color:var(--mute);text-decoration:none;font-weight:600;font-size:12px;border-radius:12px;min-height:52px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--ink)}nav.tabs a.on svg{stroke-width:2.3}
nav.tabs a.on::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--acc)}
h1{font:700 clamp(24px,6.4vw,32px)/1.1 var(--hd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font:700 17px/1.25 var(--hd);margin:30px 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 small{font:500 14px 'Golos Text',sans-serif;color:var(--mute)}
.sky{--si:#26211d;--st:rgba(38,33,29,.14);position:relative;overflow:hidden;color:var(--si);background:linear-gradient(180deg,var(--s1),var(--s2));padding:22px 0 24px}
.sky.morning{--s1:#ffe2c6;--s2:#ffc49c}
.sky.day{--s1:#d7ecfa;--s2:#a9d3f0}
.sky.evening{--s1:#6f5aa8;--s2:#3e3270;--si:#fbf7ff;--st:rgba(255,255,255,.2)}
.sky.night{--s1:#28224d;--s2:#141129;--si:#eeeaff;--st:rgba(255,255,255,.16)}
.arc{position:absolute;left:0;right:0;top:6px;width:100%;height:130px;pointer-events:none}
.arc path{fill:none;stroke:var(--st);stroke-width:1.5;stroke-dasharray:2 6}
.sun,.moon{z-index:0;position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none}
.sun{background:#fff3c4;box-shadow:0 0 0 6px rgba(255,246,214,.35),0 0 24px 8px rgba(255,236,170,.45)}
.moon{background:transparent;box-shadow:inset -5px 3px 0 0 #f3f0ff;transform:rotate(-20deg)}
.hero{z-index:1;position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.sub{opacity:.75;font-size:15px;margin-top:6px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .fg2{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.3,.5,1)}
.ring .tr{stroke:var(--st)}.ring .fg{stroke:var(--si);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.3,1.3,.5,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px/1 var(--hd);letter-spacing:-.02em}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:var(--st);border-radius:99px;padding:2px 4px 2px 12px;font-size:14px;font-weight:600;margin-top:12px}
.chip .ic{color:inherit}
.card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.stack{display:grid;gap:8px}
.item{--pc:var(--plum);--pm:light-dark(#fff,#1b1815);display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 8px 8px 14px;min-height:58px;box-shadow:var(--shadow)}
.item.pj{--pm:#2b2622}
.item.rt{--pc:var(--acc);--pm:#2b2622}
.item .tt{flex:1;overflow-wrap:anywhere;font-weight:500}
.item .tt small{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:500;color:var(--mute);font-size:13px;margin-top:2px}
.item.x .tt{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1.5px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;color:#2b2622}
.w{display:inline-block;font:700 11px/1.5 var(--hd);padding:0 6px;border-radius:99px;border:1.5px solid var(--line);color:var(--mute);white-space:nowrap;min-height:0;background:transparent}
button.w{cursor:pointer}
button{font:inherit;cursor:pointer;border-radius:12px;border:0;min-height:44px;padding:0 16px;font-weight:600;color:inherit;background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.pri{background:var(--ink);color:var(--bg)}
.soft{border:1.5px solid var(--line);color:var(--ink);background:var(--card)}
.sm{min-height:38px;padding:0 12px;font-size:14px}
.ic{width:42px;min-height:42px;padding:0;color:var(--mute);font-size:16px;flex:none}
.chk{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--pc) 70%,var(--ink));flex:none;position:relative;display:grid;place-items:center}
.chk::after{content:'';position:absolute;inset:-8px}
.chk.on{background:var(--pc);border-color:var(--pc);animation:pop .35s ease}
.chk.on::before{content:'✓';font-weight:800;font-size:16px;color:var(--pm)}
.chk.half{background:linear-gradient(90deg,var(--pc) 50%,transparent 50%)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.mn{font-size:13px;min-height:34px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line)}
.mn.on{background:var(--acc);border-color:var(--acc);color:#2b2622}
.energy{display:flex;gap:8px;margin-top:12px}
.energy button{flex:1;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font:700 18px var(--hd)}
.energy button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.elab{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:4px}
.focus{background:var(--ink);color:var(--bg);border-radius:22px;padding:20px;margin-top:16px}
.focus p{margin:0;font-weight:600;opacity:.8;overflow-wrap:anywhere}
.clock{font:700 clamp(58px,18vw,100px)/1.05 var(--hd);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--bg) 22%,transparent);margin:14px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
.focus button{border:1.5px solid color-mix(in srgb,var(--bg) 35%,transparent)}.focus .go{background:var(--acc);color:#2b2622;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.hint{color:var(--mute);font-size:15px;margin:8px 0}
.hint a{color:var(--ink)}
form.add{display:grid;gap:8px;margin-top:10px}
.add .r{display:flex;gap:8px;flex-wrap:wrap}
.add .r>input{flex:1 1 180px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;min-height:44px;width:100%}
input[type=time]{width:auto}
.seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:3px;gap:2px;flex:1 1 240px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:grid;place-items:center;min-height:36px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.proj{border-radius:20px;padding:14px 14px 10px;margin-bottom:12px;background:color-mix(in srgb,var(--pc) 32%,var(--card));box-shadow:var(--shadow)}
.proj.off{opacity:.6}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph h3{flex:1 1 140px;margin:0;font:700 17px/1.25 var(--hd);overflow-wrap:anywhere}
.ph .meta{font-size:14px;color:var(--mute);width:100%}
.proj .item{box-shadow:none;min-height:50px}
.proj .next{box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 70%,var(--ink))}
.stepper{display:inline-flex;align-items:center;background:var(--card);border-radius:12px}
.stepper button{width:36px;min-height:36px;padding:0}
.stepper span{font-size:14px;font-weight:700;padding:0 2px;white-space:nowrap}
details{margin-top:30px}
summary{font:700 17px/1.25 var(--hd);cursor:pointer;min-height:44px;display:flex;align-items:center}
.tl time{font:700 15px var(--hd);width:54px;flex:none}
.tl .cur{box-shadow:0 0 0 2px var(--acc)}
.big{font:700 clamp(52px,14vw,76px)/1 var(--hd);letter-spacing:-.03em;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.stats div{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.stats b{display:block;font:700 22px/1.1 var(--hd)}.stats span{font-size:13px;color:var(--mute)}
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
.mo b{display:block;font-size:13px;font-weight:600;margin-bottom:4px;text-transform:capitalize}
.mo .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mo i,.mo button{aspect-ratio:1;border-radius:4px;min-height:0;padding:0;display:block;width:100%}
.mo button{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.mo button.t{box-shadow:0 0 0 1.5px var(--ink)}
.mo button.t{box-shadow:0 0 0 1.5px var(--ink)}
.mo button.sel{box-shadow:0 0 0 2px var(--acc)}
.l0{background:light-dark(#8f8a84,#4a4541)!important}.l1{background:light-dark(#f0a050,#d98a45)!important}.l2{background:light-dark(#f3d35c,#e2c24f)!important}.l3{background:light-dark(#a6dba9,#6fae7b)!important}.l4{background:light-dark(#2f9e50,#45d36c)!important}
.nd{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--line)}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);margin-top:12px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg2{flex-wrap:wrap;gap:6px 14px}.lg2 span{display:inline-flex;align-items:center;gap:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips label{position:relative}.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:grid;place-items:center;min-width:44px;min-height:40px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;background:var(--card)}
.chips input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chips input:focus-visible+span{outline:3px solid var(--acc)}
.nrow{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;flex-wrap:wrap}.nrow input{width:76px}
.dnav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dnav .ic{font-size:24px;color:var(--ink)}
.dpick{position:relative;font:700 16px/1.3 var(--hd);padding:8px 10px;border-radius:12px;cursor:pointer}
.dpick:hover{background:var(--card)}
.dpick input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0;border:0}
textarea.diary{min-height:45vh;margin-top:12px;font-size:17px;line-height:1.65;padding:16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.dmeta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:6px;min-height:20px}
.dentry{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);min-height:0;font-weight:400}
.dentry.on{box-shadow:0 0 0 2px var(--plum)}
.dentry b{font-weight:700}.dentry span{color:var(--mute);font-size:13px;margin-left:8px}
.dentry p{margin:4px 0 0;color:var(--mute);font-size:15px;overflow-wrap:anywhere}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.cal{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;overflow-x:auto}
.cal>.calgrid,.calbody>.calgrid{min-width:720px}
.calgrid{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));position:relative}
.cg-head{text-align:center;padding:10px 4px 6px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.cg-head span{display:block}
.cg-head b{display:block;font:700 20px/1.2 var(--hd);color:var(--ink)}
.cg-head.t b{margin:2px auto 0;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);margin-top:2px}
.cg-gut.ad{font-size:11px;color:var(--mute);padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.cg-ad{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:grid;gap:3px;align-content:start;min-height:32px}
.adc{font-size:12px;font-weight:500;background:var(--plumsoft);color:var(--plum);border-radius:6px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adc.x{opacity:.5;text-decoration:line-through}
.calbody{max-height:calc(100vh - 290px);min-height:360px;overflow:auto}
.hrs{position:relative}.hrs span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--mute)}.hrs span:first-child{transform:none;top:2px!important}
.cg-col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);cursor:copy}
.cg-col.t{background-color:color-mix(in srgb,var(--plum) 5%,transparent)}
.ev{position:absolute;min-height:0;padding:4px 7px;border-radius:9px;background:var(--plum);color:#fff;text-align:left;overflow:hidden;display:block;font-weight:400;box-shadow:0 1px 3px var(--sh);cursor:pointer;line-height:1.25}
.ev b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev span{font-size:11px;opacity:.85}
.ev.sm1{display:flex;gap:6px;align-items:center}.ev.sm1 span{white-space:nowrap}
.ev.x{opacity:.45}.ev.x b{text-decoration:line-through}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--acc);pointer-events:none}.nowl::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,15,10,.45);display:grid;place-items:center;padding:16px}
.sheet{background:var(--bg);border-radius:22px;padding:22px;width:min(520px,100%);display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:calc(100vh - 32px);overflow:auto}
.fl{display:grid;gap:4px;font-size:13px;color:var(--mute);flex:1 1 120px}
.sheet .r{display:flex;gap:8px;flex-wrap:wrap}
.sheet input[type=time],.sheet input[type=date]{width:100%}
.grip{color:var(--mute);opacity:.35;cursor:grab;font-size:13px;letter-spacing:-3px;margin:0 -4px 0 -6px;user-select:none}
.item:hover .grip{opacity:.9}
.item.dragging{opacity:.4}
.item.drop-b{box-shadow:0 -3px 0 var(--acc),var(--shadow)}.item.drop-a{box-shadow:0 3px 0 var(--acc),var(--shadow)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches span{display:block;width:30px;height:30px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.swatches input:focus-visible+span{outline:3px solid var(--acc);outline-offset:4px}
.legend2{display:flex;gap:14px;font-size:14px;font-weight:600;margin-top:8px;flex-wrap:wrap}
.legend2 span,.split span{display:inline-flex;align-items:center;gap:6px}
.lt,.lr{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--si,var(--ink))}.lr{background:var(--acc)}
.split{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 4px}.split div{display:flex;align-items:baseline;gap:8px}.split b{font:700 22px var(--hd)}.split span{color:var(--mute);font-size:14px}
.split .lt{background:var(--ink)}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--acc) 18%,var(--card));border-radius:16px;padding:12px 14px;margin-top:20px}
.ymseg{margin-top:14px;max-width:360px}.ymseg button{flex:1;min-height:36px;border-radius:10px;font-size:14px;color:var(--mute)}.ymseg button.on{background:var(--ink);color:var(--bg)}
.daynav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dn{min-height:30px;width:30px;padding:0;border-radius:9px;font-size:18px;line-height:1;color:inherit;background:var(--st)}
.dn.wide{width:auto;padding:0 10px;font-size:13px;font-weight:600}.dn:disabled{opacity:.3}
.btnl{display:inline-grid;place-items:center;border-radius:12px;cursor:pointer;font-weight:600}
body.login nav.tabs{display:none}
.foot{color:var(--mute);font-size:13px;margin:36px 0 24px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;border-radius:16px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);z-index:9;font-size:15px;font-weight:500}
.toast[hidden]{display:none}.toast button{color:var(--acc)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.ring{width:112px;height:112px}.ring b{font-size:19px}.year{grid-template-columns:repeat(2,minmax(0,1fr))}}
summary small{font:500 14px 'Golos Text',sans-serif;color:var(--mute);margin-left:10px}
.brand{display:none}
@media(min-width:1000px){
  body{padding:0 0 0 228px}
  .wrap{max-width:1180px;padding:0 40px}
  nav.tabs{top:0;bottom:0;right:auto;width:228px;display:block;padding:24px 14px;box-shadow:1px 0 0 var(--line);background:var(--card);backdrop-filter:none}
  nav.tabs div{flex-direction:column;gap:4px}
  .brand{display:block;font:700 18px/1.2 var(--hd);padding:4px 12px 22px}
  nav.tabs a{display:flex;align-items:center;gap:12px;flex:none;font-size:15px;padding:10px 12px;min-height:46px;justify-items:start}
  nav.tabs a.on{background:var(--bg)}
  nav.tabs a.on::after{margin-left:auto;width:6px;height:6px}
  .toast{bottom:24px;left:calc(50% + 114px)}
  .cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:40px;align-items:start}
  .ring{width:150px;height:150px}.ring b{font-size:26px}
  h1{font-size:36px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Разделы"><div>

<script>
{
const $=s=>document.querySelector(s);
const K='planner-v1';
const PAL=['#f6c9a8','#c9dfc0','#c3d9ef','#dacff0','#f2df9e','#f1c3cd','#bfe3dd'];
const WN=['Лёгкая','Средняя','Сложная'];
const pad=n=>String(n).padStart(2,'0');
const dk=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({v:2,tasks:[],blocks:[],events:[],projects:[],routines:[],plans:[],rlog:{},days:{},focus:null,updated:0});
function migrate(o){
  const s=Object.assign(blank(),o||{});
  if(s.blocks&&s.blocks.length){s.blocks.forEach(b=>s.events.push({id:b.id,t:b.t,d:b.d,a:b.a,b:b.b,rep:null,ex:[],done:b.x?{[b.d]:1}:{}}));s.blocks=[]}
  if((o&&o.v||1)<2){
    s.tasks=(s.tasks||[]).map(t=>({id:t.id,t:t.t,w:t.w||2,p:t.p||null,s:t.s==='top'?'today':t.s,d:t.d||'',done:t.done||'',o:t.o||0}));
    for(const k in (o.notes||{}))(s.days[k]=s.days[k]||{}).note=o.notes[k];
    delete s.notes;s.v=2;
  }
  return s;
}
let S=blank();
try{const r=localStorage.getItem(K);if(r)S=migrate(JSON.parse(r))}catch(e){}
const SB_URL='https://pnukkzddmmjjnghumahg.supabase.co',SB_KEY='sb_publishable_DIRkmw4ROxm2M4UHypZCjg_ZzcR3esX';
let sb=null,user=null,authReady=false;try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
let cloud=false,writing=false,dirty=false,saveT=null,toastT=null,actx=null,lastMin='';
const ui={vd:null,ie:null,wk:null,ed:null,h0:7,dk:null,dq:'',pick:null,undo:null,eedit:false,sel:null,skip:(()=>{try{return localStorage.getItem('planner-skip')==='1'}catch(e){return false}})()};

const today=()=>dk();
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addMin=(hm,m)=>{const[h,mm]=hm.split(':').map(Number);const t=((h*60+mm+m)%1440+1440)%1440;return pad(t/60|0)+':'+pad(t%60)};
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return dk(d)};
const proj=id=>S.projects.find(p=>p.id===id);
const day=k=>S.days[k]||(S.days[k]={});
const dots=w=>`<span class="w" title="${WN[w-1]}">×${w}</span>`;
const tag=p=>p?`<span class="tag" style="background:${PAL[p.c%PAL.length]}">${esc(p.t)}</span>`:'';
const cur=()=>ui.vd&&ui.vd<today()?ui.vd:today();
const past=()=>cur()!==today();
const todayTasks=()=>{const k=cur();return S.tasks.filter(t=>(t.s==='today'&&t.d===k)||(t.s==='done'&&t.done===k&&(t.d===k||!t.d)))};
const tails=()=>S.tasks.filter(t=>t.s==='today'&&t.d<today()&&!t.pl);
const DN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const dow=k=>(new Date(k+'T12:00').getDay()+6)%7;
const dBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const planHits=(pl,k)=>k>=pl.start&&(pl.r==='week'?pl.days.includes(dow(k)):dBetween(pl.start,k)%pl.n===0);
const ruleText=pl=>!pl?'':pl.r==='week'?(pl.days.length===7?'каждый день':pl.days.map(i=>DN[i]).join(', ')):pl.n===1?'каждый день':pl.n===2?'через день':'каждые '+pl.n+' дн.';
const human=k=>{const s=new Date(k+'T12:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});return s};
/* ---------- calendar events ---------- */
const occurs=(e,k)=>{if(k<e.d||(e.ex&&e.ex.includes(k)))return false;if(!e.rep)return k===e.d;if(e.rep.until&&k>e.rep.until)return false;return e.rep.r==='week'?e.rep.days.includes(dow(k)):dBetween(e.d,k)%e.rep.n===0};
const occOn=k=>S.events.filter(e=>occurs(e,k)).sort((a,b)=>a.a<b.a?-1:a.a>b.a?1:0);
const toMin=hm=>{const[h,m]=hm.split(':').map(Number);return h*60+m};
const repText=r=>!r?'':r.r==='week'?(r.days.length===7?'каждый день':r.days.map(i=>DN[i]).join(', ')):r.n===1?'каждый день':r.n===2?'через день':'каждые '+r.n+' дн.';
/* recurring tasks: create today's copy once; yesterday's unfinished copies simply expire */
function materialize(){
  const k=today(),n0=S.tasks.length,seen=new Set();
  S.tasks=S.tasks.filter(t=>{if(!t.pl)return true;const key=t.pl+'|'+t.d;if(seen.has(key))return false;seen.add(key);return true});
  let ch=S.tasks.length!==n0;
  (S.plans||[]).forEach(pl=>{if(planHits(pl,k)&&!seen.has(pl.id+'|'+k)){S.tasks.push({id:uid(),t:pl.t,w:pl.w,p:pl.p||null,s:'today',d:k,done:'',o:0,pl:pl.id});ch=true}});
  return ch;
}
const steps=pid=>S.tasks.filter(t=>t.p===pid&&t.s!=='inbox').sort((a,b)=>a.o-b.o);
const nextStep=pid=>steps(pid).find(t=>t.s==='later');
const weekDone=pid=>S.tasks.filter(t=>t.p===pid&&t.s==='done'&&t.done>=monday()).length;
const view=()=>({'#calendar':'calendar','#projects':'projects','#inbox':'inbox','#diary':'diary','#review':'review'})[location.hash]||'today';

/* two separate metrics: tasks and routine. Day total = their average,
   minus half of the gap beyond 30 points (so routine can't carry the day alone) */
const combine=(T,R)=>Math.max(0,Math.round((T+R)/2-Math.max(0,Math.abs(T-R)-30)/2));
function score(k){
  let rp=0,re=0,tp=0,te=0;const L=S.rlog[k]||{};
  S.routines.forEach(r=>{rp+=r.w;if(L[r.id]==='full')re+=r.w;else if(L[r.id]==='min')re+=r.w/2});
  S.tasks.forEach(t=>{if((t.s==='today'&&t.d===k)||(t.s==='done'&&t.done===k)){tp+=t.w;if(t.s==='done')te+=t.w}});
  const T=tp?Math.round(te/tp*100):100,R=rp?Math.round(re/rp*100):100;
  return{e:te+re,p:tp+rp,te,tp,re,rp,T,R,tot:(tp||rp)?combine(T,R):null};
}
const pctOf=x=>!x?null:x.tot!==undefined?x.tot:(x.p?Math.round(x.e/x.p*100):null);
function prune(){
  const lim=dk(new Date(Date.now()-90*864e5));
  S.tasks=S.tasks.filter(t=>!(t.s==='done'&&t.done<lim)&&!(t.pl&&t.s!=='done'&&t.d<lim));
  S.blocks=[];
  S.events=S.events.filter(e=>e.rep||e.d>=lim);
  S.events.forEach(e=>{for(const k in (e.done||{}))if(k<lim)delete e.done[k];if(e.ex)e.ex=e.ex.filter(k=>k>=lim)});
  for(const k in S.rlog)if(k<lim)delete S.rlog[k];
  const ylim=dk(new Date(Date.now()-800*864e5));for(const k in S.days)if(k<ylim&&!S.days[k].note)delete S.days[k];
}
function save(draw=true){
  prune();Object.assign(day(today()),score(today()));if(past())Object.assign(day(cur()),score(cur()));
  S.updated=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,700);if(draw)render();
}
async function flush(){
  if(!sb||!user||writing||!dirty)return;
  writing=true;dirty=false;
  let err=null;
  try{const r=await sb.from('planner_state').upsert({user_id:user.id,state:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});err=r.error}catch(e){err=e}
  writing=false;
  if(err){dirty=true;cloud=false;setTimeout(flush,5000)}else{cloud=true;if(dirty)flush()}
}
function toast(msg,undo){
  const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-a="undo">Вернуть</button>':'');t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;ui.undo=null},5000);
}
const seg=(name,sel=2)=>`<div class="seg" role="radiogroup" aria-label="Сложность">${[1,2,3].map(w=>`<label><input type="radio" name="${name}" value="${w}" ${w===sel?'checked':''}><span>${WN[w-1]}</span></label>`).join('')}</div>`;

/* ---------- Сегодня ---------- */
function skyHTML(){
  const sc=score(cur()),pc=sc.tot,C=2*Math.PI*56,C2=2*Math.PI*41,PD=past();
  const now=new Date(),d=new Date(cur()+'T12:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const h=now.getHours(),m=h*60+now.getMinutes();
  const ph=h<5?'night':h<11?'morning':h<17?'day':h<22?'evening':'night';
  const hi=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':h<23?'Добрый вечер':'Доброй ночи';
  /* the sun crosses the arc 6:00–22:00, the moon 22:00–6:00 */
  const isSun=m>=360&&m<1320,f=isSun?(m-360)/960:((m-1320+1440)%1440)/480;
  const x=50-44*Math.cos(Math.PI*f),y=58-50*Math.sin(Math.PI*f);
  const body=`<span class="${isSun?'sun':'moon'}" style="left:${x}%;top:${6+y/60*130}px"></span>`;
  return `<section class="sky ${ph}"><svg class="arc" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M6 58 A44 50 0 0 1 94 58" vector-effect="non-scaling-stroke"/></svg>
  ${body}
  <div class="wrap hero"><div><h1>${PD?(cur()===shift(today(),-1)?'Вчера':'Прошлый день'):hi}</h1><div class="sub daynav"><button class="dn" data-a="vprev" aria-label="Предыдущий день"${cur()<=shift(today(),-30)?' disabled':''}>‹</button><span>${d.charAt(0).toUpperCase()+d.slice(1)}</span><button class="dn" data-a="vnext" aria-label="Следующий день"${PD?'':' disabled'}>›</button>${PD?'<button class="dn wide" data-a="vtoday">Сегодня</button>':''}</div>${pc!==null?`<div class="legend2"><span><i class="lt"></i>Дела ${sc.T}%</span><span><i class="lr"></i>Рутина ${sc.R}%</span></div>`:''}${energyChip()}</div>
  <div class="ring" role="img" aria-label="День ${pc??0}%: дела ${sc.T}%, рутина ${sc.R}%"><svg viewBox="0 0 140 140"><circle class="tr" cx="70" cy="70" r="56"/><circle class="fg" cx="70" cy="70" r="56" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(pc===null?0:sc.T)/100)}"/><circle class="tr" cx="70" cy="70" r="41"/><circle class="fg2" cx="70" cy="70" r="41" stroke-dasharray="${C2}" stroke-dashoffset="${C2*(1-(pc===null?0:sc.R)/100)}"/></svg><b>${pc!==null?pc+'%':'–'}</b></div></div></section>`;
}
function energyChip(){
  const en=day(cur()).en;if(!en||ui.eedit)return'';
  const k=en<=2?1:en<=3?2:3;
  return `<div class="row"><span class="chip">Силы ${en}/5 · главных: ${k}<button class="ic" data-a="eedit" aria-label="Изменить">✎</button></span></div>`;
}
function morningHTML(){
  if(past()||(day(today()).en&&!ui.eedit))return'';
  return `<div class="card" style="margin-top:16px"><b>Сколько сегодня сил?</b><div class="energy">${[1,2,3,4,5].map(n=>`<button data-a="en" data-n="${n}">${n}</button>`).join('')}</div><div class="elab"><span>почти нет</span><span>полно</span></div></div>`;
}
function focusHTML(){
  const f=S.focus;if(!f)return'';
  const left=Math.max(0,f.end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000),p=Math.min(100,100-left/(f.mins*600));
  return `<div class="focus"><p>${esc(f.t)}</p><div class="clock" id="clock">${left?pad(m)+':'+pad(s):'Время!'}</div><div class="bar"><i id="prog" style="width:${p}%"></i></div>
  <div class="row">${left?`<button class="sm" data-a="plus">+5 мин</button><button class="sm" data-a="stop">Стоп</button>`:`<button class="sm" data-a="more">Ещё 10 мин</button><button class="sm" data-a="stop">Закончить</button>`}${f.id?`<button class="sm go" data-a="fdone">Сделано ✓</button>`:''}</div></div>`;
}
function taskItem(t){
  const x=t.s==='done',p=proj(t.p);
  let h=`<div class="item${x?' x':''}${p?' pj" style="--pc:'+PAL[p.c%PAL.length]:''}"${x?'':` draggable="true" data-drag="task" data-id="${t.id}"`}>${x?'':'<span class="grip" aria-hidden="true">⋮⋮</span>'}<button class="chk${x?' on':''}" data-a="tdone" data-id="${t.id}" aria-label="Сделано"></button><span class="tt">${esc(t.t)}<small>${tag(p)}${dots(t.w)}${t.pl?`<span class="w">↻ ${esc(ruleText(S.plans.find(x=>x.id===t.pl)))}</span>`:''}</small></span>`;
  if(!x)h+=`<button class="ic" data-a="edit" data-k="task" data-id="${t.id}" aria-label="Изменить">✎</button><button class="ic" data-a="pick" data-id="${t.id}" aria-label="Фокус">▶</button><button class="ic" data-a="tback" data-id="${t.id}" aria-label="${t.pl?'Пропустить сегодня':'Убрать из сегодня'}">${t.pl?'⤼':'↩'}</button>`;
  h+='</div>';
  if(ui.pick===t.id)h+=`<div class="row" style="margin:0 0 4px 44px"><span class="hint" style="margin:0">Минут:</span>${[10,25,45].map(m=>`<button class="soft sm" data-a="go" data-id="${t.id}" data-m="${m}">${m}</button>`).join('')}</div>`;
  return h;
}
function todayHTML(){
  const T=todayTasks().sort((a,b)=>(a.s==='done')-(b.s==='done')||(a.ot??999)-(b.ot??999)||b.w-a.w),L=S.rlog[cur()]||{},TL=past()?[]:tails(),PD=past();
  let h=`${skyHTML()}<div class="wrap">${PD?`<div class="nudge"><div><b>Ты отмечаешь ${new Date(cur()+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}.</b> Отметь, что успел: процент того дня пересчитается.</div><button class="pri sm" data-a="vtoday">Вернуться в сегодня</button></div>`:''}${morningHTML()}${PD?'':focusHTML()}`;
  let A='',Z='';
  {const sc=score(today()),open=T.filter(t=>t.s!=='done');
   if(!PD&&!S.focus&&sc.tp&&sc.rp&&sc.R-sc.T>=40&&new Date().getHours()>=12&&open.length)
     A+=`<div class="nudge"><div><b>Рутина идёт отлично: ${sc.R}%.</b> А дела пока на ${sc.T}%. Возьмёшь одно?</div><button class="pri sm" data-a="go" data-id="${open[0].id}" data-m="10">10 минут: ${esc(open[0].t.length>34?open[0].t.slice(0,34)+'…':open[0].t)}</button></div>`}
  A+=`<h2>${PD?'Дела этого дня':'Дела на сегодня'}</h2><div class="stack">${T.map(taskItem).join('')||'<p class="hint">Пока пусто. Впиши своё или возьми шаг из проектов ниже.</p>'}</div>
  ${PD?'':`<form class="add" id="tf"><div class="r"><input id="tt" placeholder="Что важно сделать" maxlength="160" required><input type="date" id="td" value="${today()}" min="${today()}" aria-label="Когда" style="flex:0 0 auto;width:auto"></div><div class="r">${seg('tw')}<button class="pri">Добавить</button></div></form>`}`;
  const FU=S.tasks.filter(t=>t.s==='today'&&t.d>today()&&!t.pl).sort((a,b)=>a.d<b.d?-1:1);
  if(FU.length&&!PD)A+=`<details><summary>Запланировано · ${FU.length}</summary><div class="stack">${FU.map(t=>`<div class="item"><span class="tt">${esc(t.t)}<small><span>${human(t.d)}</span>${tag(proj(t.p))}${dots(t.w)}</small></span><button class="soft sm" data-a="totoday" data-id="${t.id}">Сегодня</button><button class="ic" data-a="edit" data-k="task" data-id="${t.id}" aria-label="Изменить">✎</button><button class="ic" data-a="tdel" data-id="${t.id}" aria-label="Удалить">✕</button></div>`).join('')}</div></details>`;
  if(S.routines.length)Z+=`<h2>Рутина <small>минимум засчитывается наполовину</small></h2><div class="stack">${S.routines.map(r=>{const v=L[r.id];return `<div class="item rt${v==='full'?' x':''}" draggable="true" data-drag="rt" data-id="${r.id}"><span class="grip" aria-hidden="true">⋮⋮</span><button class="chk${v==='full'?' on':v==='min'?' half':''}" data-a="rfull" data-id="${r.id}" aria-label="Сделано полностью"></button><span class="tt">${esc(r.t)}<small>${dots(r.w)}${r.min?' · минимум: '+esc(r.min):''}</small></span>${r.min?`<button class="mn${v==='min'?' on':''}" data-a="rmin" data-id="${r.id}">минимум</button>`:''}<button class="ic" data-a="edit" data-k="rt" data-id="${r.id}" aria-label="Изменить">✎</button></div>`}).join('')}</div>`;
  else Z+=`<h2>Рутина</h2><p class="hint">Ежедневные дела добавляются во вкладке <a href="#projects">Проекты</a>.</p>`;
  const act=S.projects.filter(p=>p.on).map(p=>({p,n:nextStep(p.id),lag:(p.goal||0)-weekDone(p.id)})).filter(x=>x.n).sort((a,b)=>b.lag-a.lag);
  const en=day(today()).en,k=en?(en<=2?1:en<=3?2:3):null;
  if(act.length&&!PD)A+=`<h2>Взять из проектов <small>${k?'сегодня по силам: '+k:'выбери 1–3'}</small></h2><div class="stack">${act.map(x=>`<div class="item"><span class="tt">${esc(x.n.t)}<small>${tag(x.p)}${dots(x.n.w)}${x.lag>0?' · на неделе ещё '+x.lag:''}</small></span><button class="soft sm" data-a="totoday" data-id="${x.n.id}">+ сегодня</button></div>`).join('')}</div>`;
  if(TL.length)A+=`<h2>Хвосты <small>с прошлых дней</small></h2><div class="stack">${TL.map(t=>`<div class="item"><span class="tt">${esc(t.t)}<small>${tag(proj(t.p))}${dots(t.w)}</small></span><button class="soft sm" data-a="totoday" data-id="${t.id}">На сегодня</button><button class="ic" data-a="tback" data-id="${t.id}" aria-label="Отложить">↩</button></div>`).join('')}</div>`;
  const kT=cur(),B=occOn(kT),n=nowHM(),st=B.length&&B[B.length-1].b>n?B[B.length-1].b:n;

/* ---------- Календарь ---------- */
const HPX=48;
const ECOL=[['Сливовый','#6b5aa6'],['Синий','#3b78c9'],['Бирюзовый','#1c8f84'],['Зелёный','#3c8d48'],['Оранжевый','#d9742a'],['Красный','#cf4646'],['Розовый','#c2508c'],['Серый','#6e6862']];
const ecol=e=>ECOL[(e&&e.c)||0][1];
function lanes(list){ /* side-by-side layout for overlapping events */
  const out=[];let grp=[],end=-1;
  const flush=()=>{const L=[];grp.forEach(o=>{let i=0;while(L[i]>o.s)i++;L[i]=o.en;o.lane=i});grp.forEach(o=>o.n=L.length);out.push(...grp);grp=[]};
  list.map(e=>({ev:e,s:toMin(e.a),en:Math.max(toMin(e.b),toMin(e.a)+15)})).forEach(o=>{if(o.s>=end&&grp.length)flush();grp.push(o);end=Math.max(end,o.en)});
  if(grp.length)flush();return out;
}

function calHTML(){

    if(k===k0&&nowM/60>=h0)g+=`<i class="nowl" style="top:${(nowM/60-h0)*HPX}px"></i>`;

}

function beep(){if(!actx)return;try{[0,.35,.7].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=660+t*300;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.3);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.35)})}catch(e){}}

    else if(M.k==='rt'){const r=S.routines.find(x=>x.id===M.id);r.t=v;r.w=wOf(f,'iew');r.min=$('#iem').value.trim()}
    else{const pl=S.plans.find(x=>x.id===M.id),days=[...f.querySelectorAll('input[name=ied]:checked')].map(x=>+x.value);pl.t=v;pl.w=wOf(f,'iew');
      if(days.length){pl.r='week';pl.days=days.sort();delete pl.n}else{pl.r='n';pl.n=Math.max(1,Math.min(30,parseInt($('#ien').value)||1));delete pl.days}
      S.tasks.forEach(t=>{if(t.pl===pl.id&&t.s==='today'&&t.d===today()){t.t=pl.t;t.w=pl.w}});
      S.tasks=S.tasks.filter(t=>!(t.pl===pl.id&&t.s==='today'&&t.d===today()&&!planHits(pl,today())))}
    ui.ie=null;save();toast('Сохранено');return}
  if(f.id==='evf'){readEd();const E=ui.ed;if(!E||!E.t.trim())return;if(E.b<=E.a){toast('Конец должен быть позже начала');return}
    let rep=null;if(E.r==='day')rep={r:'week',days:[0,1,2,3,4,5,6]};else if(E.r==='week'){if(!E.days.length){toast('Выбери хотя бы один день');return}rep={r:'week',days:E.days.sort()}}else if(E.r==='n')rep={r:'n',n:E.n};
    if(rep&&E.until)rep.until=E.until;
    const ex=E.id&&S.events.find(x=>x.id===E.id);
    if(ex)Object.assign(ex,{t:E.t.trim(),c:E.c||0,d:E.d,a:E.a,b:E.b,rep});else S.events.push({id:uid(),t:E.t.trim(),c:E.c||0,d:E.d,a:E.a,b:E.b,rep,ex:[],done:{}});
    ui.ed=null;save();toast(rep?'Сохранено · ↻ '+repText(rep):'Сохранено');return}
  if(f.id==='tf'){const v=$('#tt').value.trim();if(!v)return;let dd=($('#td')||{}).value||today();if(dd<today())dd=today();S.tasks.push({id:uid(),t:v,w:wOf(f,'tw'),p:null,s:'today',d:dd,done:'',o:0,ot:Math.max(-1,...S.tasks.filter(x=>x.ot!=null).map(x=>x.ot))+1});save();if(dd>today())toast('Запланировано: '+human(dd));$('#tt').focus()}
  else if(f.id==='bf'){const a=$('#ba').value,b=$('#bb').value,v=$('#bt').value.trim();if(!a||!b||!v)return;if(b<=a){toast('Конец должен быть позже начала');return}S.events.push({id:uid(),d:today(),a,b,t:v,rep:null,ex:[],done:{}});save();const d=document.querySelector('details.tl');if(d)d.open=true}
  else if(f.id==='inf'){const L=$('#int').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!L.length)return;L.forEach(v=>S.tasks.push({id:uid(),t:v.slice(0,200),w:2,p:null,s:'inbox',d:'',done:'',o:0}));save();toast(L.length===1?'Выгружено':'Выгружено: '+L.length);$('#int').focus()}
  else if(f.id==='pf'){const v=$('#pt').value.trim();if(!v)return;const used=S.projects.map(p=>p.c);let c=0;while(used.includes(c)&&c<PAL.length)c++;S.projects.push({id:uid(),t:v,c:c%PAL.length,on:S.projects.filter(p=>p.on).length<4,goal:2});save()}
  else if(f.id==='plf'){const v=$('#plt').value.trim();if(!v)return;const days=[...f.querySelectorAll('input[name=pld]:checked')].map(x=>+x.value);
    const pl={id:uid(),t:v,w:wOf(f,'plw'),start:today()};if(days.length){pl.r='week';pl.days=days}else{pl.r='n';pl.n=Math.max(1,Math.min(30,parseInt($('#pln').value)||1))}
    S.plans.push(pl);save();toast('Повтор: '+ruleText(pl))}
  else if(f.id==='rf'){const v=$('#rt').value.trim();if(!v)return;S.routines.push({id:uid(),t:v,w:wOf(f,'rw'),min:$('#rm').value.trim()});save()}
  else if(f.dataset.f==='sf'){const pid=f.dataset.id,v=f.elements.t.value.trim();if(!v)return;S.tasks.push({id:uid(),t:v,w:wOf(f,'sw-'+pid),p:pid,s:'later',d:'',done:'',o:maxO(pid)+1});save();const nf=document.querySelector(`form[data-id="${pid}"] input[name=t]`);if(nf)nf.focus()}
});
let noteT=null;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList.contains('dnote')){const k=el.dataset.k;clearTimeout(noteT);const st=$('#dsaved');if(st)st.textContent='…';
    noteT=setTimeout(()=>{const v=el.value,d=day(k);if(v.trim()){d.note=v;d.nt=Date.now()}else delete d.note;save(false);if(st)st.textContent='Сохранено'},600);
    const wc=$('#dwc');if(wc){const n=(el.value.match(/\S+/g)||[]).length;wc.textContent=n?n+' сл.':''}}
  if(el.id==='dq'){ui.dq=el.value;const L=$('#dlist');if(L)L.innerHTML=diaryList()}
});
document.addEventListener('change',e=>{if(e.target.id==='edr'){readEd();render();const s2=$('#edr');if(s2)s2.focus()}});
document.addEventListener('click',e=>{const c=e.target.closest('.cg-col');if(!c||e.target.closest('.ev'))return;const r=c.getBoundingClientRect(),m=Math.floor(((e.clientY-r.top)/HPX+(ui.h0||0))*2)/2;
  openEd({d:c.dataset.k,a:pad(Math.floor(m))+':'+(m%1?'30':'00')})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ui.ed||ui.ie)){ui.ed=null;ui.ie=null;render()}});
/* drag to reorder: today's tasks and routines */
let drag=null;
const clearDrop=()=>document.querySelectorAll('.drop-b,.drop-a').forEach(x=>x.classList.remove('drop-b','drop-a'));
document.addEventListener('dragstart',e=>{const it=e.target.closest&&e.target.closest('[data-drag]');if(!it)return;drag={type:it.dataset.drag,id:it.dataset.id};it.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag.id)}catch(_){}});
document.addEventListener('dragover',e=>{if(!drag)return;const it=e.target.closest&&e.target.closest('[data-drag]');if(!it||it.dataset.drag!==drag.type)return;e.preventDefault();clearDrop();if(it.dataset.id===drag.id)return;const r=it.getBoundingClientRect();it.classList.add(e.clientY<r.top+r.height/2?'drop-b':'drop-a')});
document.addEventListener('drop',e=>{if(!drag)return;const it=e.target.closest&&e.target.closest('[data-drag]');e.preventDefault();
  if(it&&it.dataset.drag===drag.type&&it.dataset.id!==drag.id){const before=it.classList.contains('drop-b');
    const ids=[...document.querySelectorAll(`[data-drag="${drag.type}"]`)].map(x=>x.dataset.id).filter(x=>x!==drag.id);let i=ids.indexOf(it.dataset.id);if(!before)i++;ids.splice(i,0,drag.id);
    if(drag.type==='task')ids.forEach((id,n)=>{const t=S.tasks.find(x=>x.id===id);if(t)t.ot=n});
    else S.routines.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
    drag=null;clearDrop();save();return}
  clearDrop()});
document.addEventListener('dragend',()=>{drag=null;clearDrop();document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'))});
document.addEventListener('change',e=>{if(e.target.id==='dpick'&&e.target.value){ui.dk=e.target.value>today()?today():e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.id!=='imp'||!e.target.files[0])return;e.target.files[0].text().then(txt=>{const d=JSON.parse(txt);if(!d||!Array.isArray(d.tasks))throw 0;S=migrate(d);S.updated=0;save();toast('Данные импортированы')}).catch(()=>toast('Это не файл планера'))});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#add=')){readImport();render();return}if(location.hash==='#calendar')scrollNow();ui.pick=null;render();scrollTo(0,0)});

setInterval(()=>{
  const f=S.focus;
  if(f){const left=Math.max(0,f.end-Date.now());
    document.title=left?pad(Math.floor(left/60000))+':'+pad(Math.floor(left%60000/1000))+' · Фокус':'Время! · Мой день';
    if(!left&&!f.rang){f.rang=true;beep();save();return}
    const c=$('#clock'),pr=$('#prog');if(c&&left){c.textContent=pad(Math.floor(left/60000))+':'+pad(Math.floor(left%60000/1000));pr.style.width=Math.min(100,100-left/(f.mins*600))+'%'}
  }else if(document.title!=='Мой день')document.title='Мой день';
  const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(nowHM()!==lastMin&&!busy)render();
},1000);

readImport();render();if(view()==='calendar')scrollNow();

/* ---------- Supabase: вход по почте и синхронизация ---------- */
async function pull(){
  if(!sb||!user)return;
  const{data,error}=await sb.from('planner_state').select('state').eq('user_id',user.id).maybeSingle();
  if(error){cloud=false;toast('Нет связи с базой: '+error.message);return}
  cloud=true;pulled=true;const cs=data&&data.state;
  if(cs&&(cs.updated||0)>(S.updated||0)&&!dirty&&!writing){
    S=migrate(cs);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
    const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(!busy)render();
  }else if(!cs||(S.updated||0)>(cs.updated||0)){S.updated=Math.max(S.updated||0,Date.now());dirty=true;flush();render()}
  else render();
}
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session?session.user:null,changed=(u&&u.id)!==(user&&user.id);
    user=u;if(!user)cloud=false;
    const first=!authReady;authReady=true;
    if(changed||first){render();if(user&&changed)pull()}
  });
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
}
}
